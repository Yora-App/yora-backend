name: ci.yaml
on:
  # Trigger ci on pushes to a branch
  push:
    branches:
      - "*"
  # And on all pull requests
  pull_request:
    branches:
      - "*"
  # Allow the ci to be triggered manually
  workflow_dispatch:

jobs:
  application-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.0.0
        with:
          distribution: "corretto"
          java-version: "24"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew  test

