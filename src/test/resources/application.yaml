spring:
  application:
    name: yora-backend
  sql:
    init:
      schema-locations: classpath:schema-h2.sql
      mode: always
  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: username
    password: password
    driver-class-name: org.h2.Driver

